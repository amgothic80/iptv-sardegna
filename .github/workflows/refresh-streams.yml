name: Aggiorna stream Dailymotion

# Videolina, Sardegna 1 e L'Unione TV trasmettono su Dailymotion con URL HLS
# a token temporaneo: questo workflow rigenera i file in streams/ ogni 4 ore
# così la playlist principale resta sempre funzionante.

on:
  schedule:
    - cron: "23 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rigenera i file streams/*.m3u8
        run: python3 scripts/refresh_dailymotion.py

      - name: Commit e push se ci sono modifiche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streams/
          if ! git diff --cached --quiet; then
            git commit -m "Aggiorna token stream Dailymotion"
            git push
          else
            echo "Nessuna modifica da committare"
          fi

